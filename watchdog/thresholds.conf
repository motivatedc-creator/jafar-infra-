# thresholds.conf - item #3 watchdog limits. Read by watchdog.sh on every
# run (every 5 minutes), so an edit takes effect on the next run.
#
# Format: one KEY=VALUE per line, no spaces around "=", no quotes.
# Lines starting with # are comments. Unknown keys are ignored with a note.
# This file holds no secrets: those live in ~/.config/jafar/*.env.

# Disk usage of / in percent: above WARN = WARN, above CRIT = CRIT.
DISK_WARN_PCT=85
DISK_CRIT_PCT=95

# MemAvailable from /proc/meminfo, in MiB: below this = WARN (1.5 GB).
MEM_WARN_MB=1536

# Hottest /sys/class/thermal/thermal_zone*/temp, in degrees C: above = WARN.
# Skipped when the machine exposes no thermal zones.
TEMP_WARN_C=85

# Age of the last successful backup, in hours: older = WARN.
BACKUP_MAX_AGE_HOURS=26

# After restarting a stopped hermes-gateway, wait this long before rechecking.
GATEWAY_RESTART_WAIT_SECONDS=30

# Host pinged once per run; no reply = OFFLINE.
PING_HOST=1.1.1.1

# Days of history.log kept.
HISTORY_DAYS=7
